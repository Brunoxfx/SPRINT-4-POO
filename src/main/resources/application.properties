spring.application.name=motiva

# Conexao Oracle FIAP: as credenciais vem das mesmas variaveis de ambiente da Sprint 3
spring.datasource.url=${MOTIVA_DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${MOTIVA_DB_USER}
spring.datasource.password=${MOTIVA_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# As tabelas da Sprint 3 sao reaproveitadas: o Hibernate nao cria nem altera nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
